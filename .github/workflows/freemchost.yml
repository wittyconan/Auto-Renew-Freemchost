name: Freemchost Auto Renew & Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '1 0 * * *'

# 保持单例运行，防止并发堆叠
concurrency:
  group: freemchost-renew-single
  cancel-in-progress: false

permissions:
  actions: write
  contents: write # 必须为 write，否则更新 time.txt 时的 git push 会被 403 拒绝

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器依赖
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 安装依赖与 Chromium 内核
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: ⚙ 设置sing-box代理
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 运行开机检查与自动续期任务
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL || '' }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD || '' }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: socks5://127.0.0.1:1080 # 确保 Playwright 连入 sing-box 本地端口
        run: node renew.js

      - name: 归档运行截图凭据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      # 更新时间到 time.txt，避免长期未更新导致 GitHub Actions 定时任务自动暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
